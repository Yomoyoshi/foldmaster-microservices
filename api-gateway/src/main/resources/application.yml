server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**
        - id: contact-service
          uri: lb://contact-service
          predicates:
            - Path=/api/contact/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/images/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka