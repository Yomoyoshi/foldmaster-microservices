<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сброс пароля – FoldMaster</title>
    <link rel="stylesheet" href="css/style.css_">
</head>
<body>
<header class="header">
    <div class="nav-container">
        <div class="logo" style="display: flex; align-items: center; gap: 0; text-decoration: none;">
            <a href="index.html" style="display: flex; align-items: center; gap: 0; text-decoration: none; color: var(--primary);">
                <img src="images/logo3.png" alt="FoldMaster" style="height: 40px; width: auto; display: block;">
                <span style="font-size: 1.9rem; font-weight: 800; letter-spacing: -0.5px; margin-left: 0;">FoldMaster</span>
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="admin-products.html" id="adminNavLink" style="display:none;">Админка</a></li>
            <li><a href="index.html_">Главная</a></li>
            <li><a href="catalog.html_">Каталог</a></li>
            <li><a href="contacts.html">Контакты</a></li>
            <li><a href="#" id="authNavLink">Войти</a></li>
        </ul>
    </div>
</header>

<main style="max-width: 500px; margin: 4rem auto; padding: 2rem; background: white; border-radius: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.05);">
    <h2>Придумайте новый пароль</h2>
    <form id="resetForm">
        <div class="form-group">
            <input type="password" id="newPassword" placeholder="Новый пароль" required minlength="6">
        </div>
        <div class="form-group">
            <input type="password" id="confirmPassword" placeholder="Подтвердите пароль" required minlength="6">
        </div>
        <button type="submit" class="btn">Сменить пароль</button>
        <div id="resetError" style="color: red; margin-top: 1rem;"></div>
    </form>
</main>

<footer>
    <p>© 2026 FoldMaster — Смена пароля</p>
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js?v=2"></script> <!-- Добавил параметр, чтобы сбросить кэш -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        if (!token) {
            document.getElementById('resetError').innerText = 'Неверная ссылка для сброса.';
            return;
        }

        // Проверяем, что функция resetPassword доступна
        if (typeof window.resetPassword !== 'function') {
            document.getElementById('resetError').innerText = 'Ошибка загрузки скрипта. Попробуйте обновить страницу.';
            console.error('resetPassword not found in window');
            return;
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            try {
                await window.resetPassword(token, newPassword, confirmPassword);
                alert('Пароль успешно изменён!');
                window.location.href = '/index.html';
            } catch (err) {
                document.getElementById('resetError').innerText = err.message;
            }
        });
    });
</script>
</body>
</html>
