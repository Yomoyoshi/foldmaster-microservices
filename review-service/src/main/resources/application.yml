server:
  port: 8083

spring:
  application:
    name: review-service

  datasource:
    url: jdbc:postgresql://localhost:5432/reviewdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

jwt:
  secret: mySuperSecretKeyForJWTGeneration123!
  expiration: 86400000

logging:
  level:
    com.foldmaster: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

spring.cloud.openfeign.enabled: true