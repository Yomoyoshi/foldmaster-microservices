server:
  port: 8084

spring:
  application:
    name: contact-service

  datasource:
    url: jdbc:postgresql://localhost:5432/contactdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

jwt:
  secret: mySuperSecretKeyForJWTGeneration123!
  expiration: 86400000

logging:
  level:
    com.foldmaster: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# Настройки для отправки email
contact:
  email:
    to: support@foldmaster.com
    subject: New Contact Message